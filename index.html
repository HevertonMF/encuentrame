<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encuéntrame — psicólogos y pacientes</title>
<link rel="icon" type="image/png" href="logo/favicon-64.png">
<link rel="apple-touch-icon" href="logo/simbolo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F3EEFA;
    --ink: #3A2A5C;
    --ink-secondary: #5E5378;
    --ink-muted: #9389A8;
    --primary: #8E6FAE;
    --primary-strong: #6E4E9A;
    --on-primary: #FFFFFF;
    --accent: #6E4E9A;
    --accent-bg: #F3EEFA;
    --warm: #6E4E9A;
    --warm-bg: #F1F6DD;
    --border: rgba(58, 42, 92, 0.12);
    --border-strong: rgba(58, 42, 92, 0.24);
    --danger: #A6433A;
    --danger-bg: #F6E1DE;
    --radius: 18px;
    --lime: #D3E39A;
    --lime-strong: #C2D683;
    --lime-ink: #3A2A5C;
    --font-display: Calibri, 'Carlito', 'Segoe UI', sans-serif;
    --font-body: Calibri, 'Carlito', 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #241A38;
      --surface: #2F2347;
      --surface-2: #3A2C57;
      --ink: #F3EEFA;
      --ink-secondary: #CBBFE0;
      --ink-muted: #9C8FB8;
      --primary: #B69BD6;
      --primary-strong: #CDB8E6;
      --on-primary: #241A38;
      --accent: #D3E39A;
      --accent-bg: #3F4A25;
      --warm: #D3E39A;
      --warm-bg: #3F4A25;
      --border: rgba(243, 238, 250, 0.14);
      --border-strong: rgba(243, 238, 250, 0.26);
      --danger: #E39B92;
      --danger-bg: #3A211E;
    }
  }

  :root[data-theme="dark"] {
    --bg: #241A38;
    --surface: #2F2347;
    --surface-2: #3A2C57;
    --ink: #F3EEFA;
    --ink-secondary: #CBBFE0;
    --ink-muted: #9C8FB8;
    --primary: #B69BD6;
    --primary-strong: #CDB8E6;
    --on-primary: #241A38;
    --accent: #D3E39A;
    --accent-bg: #3F4A25;
    --warm: #D3E39A;
    --warm-bg: #3F4A25;
    --border: rgba(243, 238, 250, 0.14);
    --border-strong: rgba(243, 238, 250, 0.26);
    --danger: #E39B92;
    --danger-bg: #3A211E;
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; letter-spacing: -0.01em; }

  a { color: inherit; }

  button, input, select, textarea { font-family: var(--font-body); font-size: 15px; color: var(--ink); }

  button { cursor: pointer; }

  ::selection { background: var(--accent-bg); }

  #app { min-height: 100%; }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--ink);
    padding: 0;
  }

  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #F7F4EE;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px var(--border);
  }
  .brand-mark img { width: 32px; height: 32px; display: block; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.97); }

  .btn-primary {
    background: var(--lime);
    border-color: var(--lime);
    color: var(--lime-ink);
    font-weight: 700;
  }
  .btn-primary:hover { background: var(--lime-strong); border-color: var(--lime-strong); }

  .btn-ghost {
    border-color: transparent;
    background: transparent;
  }
  .btn-ghost:hover { background: var(--surface-2); }

  .btn-danger-outline {
    border-color: var(--danger);
    color: var(--danger);
    background: transparent;
  }
  .btn-danger-outline:hover { background: var(--danger-bg); }

  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-block { width: 100%; }

  /* Landing */
  .hero {
    position: relative;
    overflow: hidden;
    margin-top: 28px;
    padding: 64px 56px 60px;
    border-radius: 22px;
    color: #FFFFFF;
    background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201200%20300%22%20preserveAspectRatio%3D%22none%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-opacity%3D%220.2%22%20stroke-width%3D%221%22%3E%3Cpath%20d%3D%22M0%2070%20C%20250%2010%2C%20450%20250%2C%20700%20150%20S%201050%2040%2C%201200%2030%22%20/%3E%3Cpath%20d%3D%22M0%2082%20C%20250%2026%2C%20450%20246%2C%20700%20156%20S%201050%2054%2C%201200%2047%22%20/%3E%3Cpath%20d%3D%22M0%2094%20C%20250%2042%2C%20450%20242%2C%20700%20162%20S%201050%2068%2C%201200%2064%22%20/%3E%3Cpath%20d%3D%22M0%20106%20C%20250%2058%2C%20450%20238%2C%20700%20168%20S%201050%2082%2C%201200%2081%22%20/%3E%3Cpath%20d%3D%22M0%20118%20C%20250%2074%2C%20450%20234%2C%20700%20174%20S%201050%2096%2C%201200%2098%22%20/%3E%3Cpath%20d%3D%22M0%20130%20C%20250%2090%2C%20450%20230%2C%20700%20180%20S%201050%20110%2C%201200%20115%22%20/%3E%3Cpath%20d%3D%22M0%20142%20C%20250%20106%2C%20450%20226%2C%20700%20186%20S%201050%20124%2C%201200%20132%22%20/%3E%3Cpath%20d%3D%22M0%20154%20C%20250%20122%2C%20450%20222%2C%20700%20192%20S%201050%20138%2C%201200%20149%22%20/%3E%3Cpath%20d%3D%22M0%20166%20C%20250%20138%2C%20450%20218%2C%20700%20198%20S%201050%20152%2C%201200%20166%22%20/%3E%3Cpath%20d%3D%22M0%20178%20C%20250%20154%2C%20450%20214%2C%20700%20204%20S%201050%20166%2C%201200%20183%22%20/%3E%3Cpath%20d%3D%22M0%20190%20C%20250%20170%2C%20450%20210%2C%20700%20210%20S%201050%20180%2C%201200%20200%22%20/%3E%3Cpath%20d%3D%22M0%20202%20C%20250%20186%2C%20450%20206%2C%20700%20216%20S%201050%20194%2C%201200%20217%22%20/%3E%3Cpath%20d%3D%22M0%20214%20C%20250%20202%2C%20450%20202%2C%20700%20222%20S%201050%20208%2C%201200%20234%22%20/%3E%3Cpath%20d%3D%22M0%20226%20C%20250%20218%2C%20450%20198%2C%20700%20228%20S%201050%20222%2C%201200%20251%22%20/%3E%3Cpath%20d%3D%22M0%20238%20C%20250%20234%2C%20450%20194%2C%20700%20234%20S%201050%20236%2C%201200%20268%22%20/%3E%3Cpath%20d%3D%22M0%20250%20C%20250%20250%2C%20450%20190%2C%20700%20240%20S%201050%20250%2C%201200%20285%22%20/%3E%3C/g%3E%3C/svg%3E") center / 100% 70% no-repeat,
      linear-gradient(135deg, #7A5A9E 0%, #A07FBE 45%, #6A4C93 100%);
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    opacity: .85;
    margin: 0 0 28px;
  }
  .hero .kicker { color: var(--lime); font-size: 18px; margin: 0 0 10px; }
  .hero h1 {
    font-size: clamp(32px, 5vw, 50px);
    line-height: 1.12;
    max-width: 680px;
    margin: 0;
  }
  .hero p.lead {
    margin: 22px 0 30px;
    max-width: 520px;
    color: rgba(255,255,255,.92);
    font-size: 18px;
  }
  .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-ctas .btn { padding: 13px 28px; font-size: 16px; }
  .btn-outline-light { border-color: rgba(255,255,255,.75); color: #FFFFFF; }
  .btn-outline-light:hover { background: rgba(255,255,255,.12); }
  @media (max-width: 620px) { .hero { padding: 44px 26px; } }

  .section { margin: 64px 0 0; }
  .section h2 { font-size: clamp(26px, 4vw, 38px); color: var(--ink); }
  .section .eyebrow { color: var(--ink-muted); opacity: 1; margin-bottom: 12px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 28px; }
  @media (max-width: 820px) { .steps { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .steps { grid-template-columns: 1fr; } }
  .step { background: var(--surface-2); border-radius: var(--radius); padding: 22px; }
  .step .num {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; margin-bottom: 18px;
  }
  .step h3 { font-size: 19px; margin-bottom: 14px; }
  .step p { margin: 0; color: var(--ink-secondary); font-size: 15px; }

  .role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin: 28px 0 0;
  }
  @media (max-width: 620px) {
    .role-grid { grid-template-columns: 1fr; }
  }

  .role-card {
    text-align: left;
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color .15s ease, transform .1s ease;
  }
  .role-card:hover { border-color: var(--primary); transform: translateY(-2px); }

  .role-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
  }
  .role-icon.pat { background: var(--primary); color: #fff; }
  .role-icon.psi { background: var(--lime); color: var(--lime-ink); }

  .role-card h3 { font-size: 20px; }
  .role-card p { margin: 0; color: var(--ink-secondary); font-size: 15px; }

  .foot-note {
    max-width: 640px;
    margin: 56px 0 48px;
    padding: 16px 18px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    color: var(--ink-secondary);
    font-size: 13px;
    text-align: left;
  }
  .foot-note strong { color: var(--ink); }

  /* Auth */
  .auth-shell {
    max-width: 460px;
    margin: 48px auto 60px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px 28px 26px;
  }
  .auth-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    padding: 4px;
    border-radius: 999px;
    margin-bottom: 22px;
  }
  .auth-tab {
    flex: 1;
    text-align: center;
    padding: 9px 0;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--ink-secondary);
    font-weight: 600;
    font-size: 13px;
  }
  .auth-tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--border); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin-bottom: 6px;
  }
  .field input[type=text],
  .field input[type=email],
  .field input[type=password],
  .field input[type=tel],
  .field textarea,
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    background: var(--bg);
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 74px; }
  .field-hint { font-size: 12px; color: var(--ink-muted); margin-top: 5px; }
  .field-error { font-size: 12.5px; color: var(--danger); margin-top: 5px; }

  .tag-check-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    background: var(--surface);
  }
  .tag-check input { accent-color: var(--primary); }
  .tag-check.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); font-weight: 700; }

  .photo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .avatar {
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 500;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    color: #fff;
  }

  /* App shell (dashboards) */
  .app-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .app-top .who { display: flex; align-items: center; gap: 10px; }
  .app-top .who span { font-weight: 600; font-size: 14px; }
  .app-top .who small { display: block; color: var(--ink-secondary); font-size: 12px; }

  .tabbar {
    display: flex;
    gap: 6px;
    margin: 22px 0 26px;
    border-bottom: 1px solid var(--border);
  }
  .tabbtn {
    padding: 10px 4px;
    margin-right: 22px;
    border: none;
    background: none;
    color: var(--ink-secondary);
    font-weight: 600;
    font-size: 14px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabbtn.active { color: var(--ink); border-bottom-color: var(--primary); }

  .search-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .search-row input[type=text] {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
  }

  .chip-filter {
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    font-size: 13px;
    color: var(--ink-secondary);
  }
  .chip-filter.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); font-weight: 700; }

  .psi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .psi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .psi-card .head { display: flex; gap: 12px; align-items: center; }
  .psi-card h3 { font-size: 17px; }
  .psi-card .bio-snip { color: var(--ink-secondary); font-size: 13px; margin: 0; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--primary-strong);
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-secondary);
  }
  .empty-state h3 { font-size: 18px; color: var(--ink); margin-bottom: 6px; }

  /* Modal (in-flow, per authoring rules — no position:fixed reliance for layout collapse issues, but overlay works fine on full page artifacts) */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 9, 0.55);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 50;
  }
  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    max-width: 520px;
    width: 100%;
    padding: 28px;
    margin-top: env(safe-area-inset-top, 0px);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }

  .detail-avatar-row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
  .contact-line { display: flex; gap: 8px; font-size: 13.5px; color: var(--ink-secondary); margin-top: 3px; }

  .req-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .req-item .meta { color: var(--ink-secondary); font-size: 12.5px; margin-bottom: 6px; }
  .req-item .resumen { font-size: 14px; margin: 6px 0 10px; }
  .status-pill {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .status-pill.pend { background: var(--warm-bg); color: var(--warm); }
  .status-pill.cont { background: var(--accent-bg); color: var(--accent); }

  .banner {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .banner.ok { background: var(--accent-bg); color: var(--accent); }
  .banner.err { background: var(--danger-bg); color: var(--danger); }

  .card-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    max-width: 560px;
  }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 520px) { .two-col { grid-template-columns: 1fr; } }

  .footer-space { height: 60px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var ESPECIALIDADES = [
    "Duelo", "Depresión", "Ansiedad", "Terapia de pareja",
    "Terapia infantil y adolescente", "Adicciones", "Estrés y burnout",
    "Autoestima", "Trauma", "Trastornos del sueño"
  ];

  var AVATAR_COLORS = ["#2A7272", "#0B2A45", "#C8714A", "#4A7FA6", "#8C5A7A", "#5C8A6E"];

  function safeGet(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function safeSet(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }

  var KEY_PSI = "psiapp_psicologos";
  var KEY_PAC = "psiapp_pacientes";
  var KEY_SOL = "psiapp_solicitudes";
  var KEY_SESSION = "psiapp_session";

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function hashPassword(pw) {
    var h = 5381;
    for (var i = 0; i < pw.length; i++) {
      h = ((h << 5) + h) + pw.charCodeAt(i);
      h = h & h;
    }
    return "d" + h;
  }

  function initials(nombre) {
    var parts = nombre.trim().split(/\s+/);
    var a = parts[0] ? parts[0][0] : "";
    var b = parts[1] ? parts[1][0] : "";
    return (a + b).toUpperCase() || "?";
  }

  function colorFor(nombre) {
    var sum = 0;
    for (var i = 0; i < nombre.length; i++) sum += nombre.charCodeAt(i);
    return AVATAR_COLORS[sum % AVATAR_COLORS.length];
  }

  function avatarHtml(nombre, fotoDataUrl, size) {
    size = size || 44;
    var style = "width:" + size + "px;height:" + size + "px;font-size:" + Math.round(size * 0.38) + "px;";
    if (fotoDataUrl) {
      style += "background-image:url(" + JSON.stringify(fotoDataUrl) + ");";
      return '<div class="avatar" style="' + style + '"></div>';
    }
    style += "background:" + colorFor(nombre) + ";";
    return '<div class="avatar" style="' + style + '">' + escapeHtml(initials(nombre)) + '</div>';
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function fmtFecha(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
    } catch (e) {
      return "";
    }
  }

  // ---- Patient dashboard ----
  function viewPatientDashboard() {
    var pacientes = safeGet(KEY_PAC, []);
    var me = pacientes.filter(function (p) { return p.id === state.session.id; })[0];
    if (!me) { logout(); return ""; }

    var psi = safeGet(KEY_PSI, []);
    var filtered = psi.filter(function (p) {
      var matchEsp = !state.filtroEspecialidad || p.especialidades.indexOf(state.filtroEspecialidad) !== -1;
      var matchTxt = !state.filtroTexto || p.nombre.toLowerCase().indexOf(state.filtroTexto.toLowerCase()) !== -1;
      return matchEsp && matchTxt;
    });

    var solicitudes = safeGet(KEY_SOL, []).filter(function (s) { return s.pacienteId === me.id; });

    var body = "";
    if (state.patientTab === "buscar") {
      body += '<div class="search-row"><input type="text" placeholder="Buscar por nombre..." value="' + escapeHtml(state.filtroTexto) + '" data-action="filtro-texto"></div>';
      body += '<div class="search-row">';
      body += '<button class="chip-filter' + (!state.filtroEspecialidad ? " on" : "") + '" data-action="filtro-esp" data-esp="">Todas</button>';
      ESPECIALIDADES.forEach(function (esp) {
        body += '<button class="chip-filter' + (state.filtroEspecialidad === esp ? " on" : "") + '" data-action="filtro-esp" data-esp="' + escapeHtml(esp) + '">' + escapeHtml(esp) + '</button>';
      });
      body += '</div>';

      if (filtered.length === 0) {
        body += '<div class="empty-state"><h3>No hay psicólogos con este filtro</h3><p>Prueba con otra especialidad o borra la búsqueda.</p></div>';
      } else {
        body += '<div class="psi-grid">';
        filtered.forEach(function (p) {
          body += (
            '<div class="psi-card">' +
              '<div class="head">' + avatarHtml(p.nombre, p.fotoDataUrl, 46) +
                '<div><h3>' + escapeHtml(p.nombre) + '</h3></div></div>' +

    return (
      '<div class="wrap">' +
        appTopbar(me.nombre, "Paciente") +
        (state.requestBanner ? '<div class="banner ok">' + escapeHtml(state.requestBanner) + '</div>' : '') +
        '<div class="tabbar">' +
          '<button class="tabbtn' + (state.patientTab === "buscar" ? " active" : "") + '" data-action="patient-tab" data-tab="buscar">Buscar psicólogo</button>' +
          '<button class="tabbtn' + (state.patientTab === "solicitudes" ? " active" : "") + '" data-action="patient-tab" data-tab="solicitudes">Mis solicitudes</button>' +
        '</div>' +
        body +
        '<div class="footer-space"></div>' +
      '</div>' +
      (state.detailPsiId ? modalPsiDetail(state.detailPsiId) : "")
    );
  }

  function modalPsiDetail(id) {
    var psi = safeGet(KEY_PSI, []);
    var p = psi.filter(function (x) { return x.id === id; })[0];
    if (!p) return "";
    return (
      '<div class="overlay">' +
        '<div class="modal" data-stop="1">' +
          '<div class="modal-head">' +
            '<div class="detail-avatar-row">' + avatarHtml(p.nombre, p.fotoDataUrl, 58) +
              '<div><h3 style="font-size:19px;">' + escapeHtml(p.nombre) + '</h3>' +
              '<div class="contact-line">' + escapeHtml(p.contactoEmail || "") + '</div>' +
              (p.contactoTelefono ? '<div class="contact-line">' + escapeHtml(p.contactoTelefono) + '</div>' : '') +
              '</div></div>' +
            '<button class="btn btn-ghost btn-sm" data-action="close-modal">✕</button>' +
          '</div>' +
          '<div class="tag-row" style="margin-bottom:12px;">' + p.especialidades.map(function (e) { return '<span class="tag">' + escapeHtml(e) + '</span>'; }).join("") + '</div>' +
          '<p style="font-size:14px;color:var(--ink-secondary);margin-bottom:18px;">' + escapeHtml(p.bio || "") + '</p>' +
          '<form data-form="solicitud" data-psi-id="' + p.id + '">' +
            '<div class="field"><label>Cuéntale brevemente tu situación</label><textarea name="resumen" required placeholder="Por ejemplo: llevo unas semanas con mucha ansiedad por el trabajo y me gustaría empezar a hablarlo."></textarea></div>' +
            '<div class="field"><label>Prefiero que me contacten por</label>' +
              '<div class="tag-check-grid">' +
                '<label class="tag-check"><input type="radio" name="contacto" value="email" checked> Correo</label>' +
                '<label class="tag-check"><input type="radio" name="contacto" value="telefono"> Teléfono</label>' +
              '</div>' +
            '</div>' +
            '<button type="submit" class="btn btn-primary btn-block">Enviar solicitud</button>' +
          '</form>' +
        '</div>' +
      '</div>'
    );
  }

  // ---- Psychologist dashboard ----
  function viewPsiDashboard() {
    var psi = safeGet(KEY_PSI, []);
    var me = psi.filter(function (p) { return p.id === state.session.id; })[0];
    if (!me) { logout(); return ""; }

    var solicitudes = safeGet(KEY_SOL, []).filter(function (s) { return s.psicologoId === me.id; });

    var body = "";
    if (state.psiTab === "perfil") {
      if (state.editingProfile) {
        body += (
          '<div class="card-form">' +
            '<form data-form="edit-perfil">' +
              photoField(me.fotoDataUrl) +
              '<div class="field"><label>Nombre completo</label><input type="text" name="nombre" required value="' + escapeHtml(me.nombre) + '"></div>' +
              '<div class="field"><label>Correo de contacto</label><input type="email" name="contactoEmail" value="' + escapeHtml(me.contactoEmail || "") + '"></div>' +
              '<div class="field"><label>Teléfono de contacto</label><input type="tel" name="contactoTelefono" value="' + escapeHtml(me.contactoTelefono || "") + '"></div>' +
              '<div class="field"><label>Especialidades</label>' + tagCheckGrid(me.especialidades) + '</div>' +
              '<div class="field"><label>Breve presentación</label><textarea name="bio">' + escapeHtml(me.bio || "") + '</textarea></div>' +
              '<div style="display:flex;gap:10px;"><button type="submit" class="btn btn-primary">Guardar cambios</button><button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancelar</button></div>' +
            '</form>' +
          '</div>'
        );
      } else {
        body += (
          '<div class="card-form">' +
            '<div class="detail-avatar-row">' + avatarHtml(me.nombre, me.fotoDataUrl, 58) +
              '<div><h3 style="font-size:19px;">' + escapeHtml(me.nombre) + '</h3>' +
              '<div class="contact-line">' + escapeHtml(me.contactoEmail || "") + '</div>' +
              (me.contactoTelefono ? '<div class="contact-line">' + escapeHtml(me.contactoTelefono) + '</div>' : '') +
              '</div></div>' +
            '<div class="tag-row" style="margin-bottom:14px;">' + (me.especialidades.length ? me.especialidades.map(function (e) { return '<span class="tag">' + escapeHtml(e) + '</span>'; }).join("") : '<span class="field-hint">Sin especialidades aún</span>') + '</div>' +
            '<p style="font-size:14px;color:var(--ink-secondary);margin-bottom:16px;">' + escapeHtml(me.bio || "Todavía no escribiste tu presentación.") + '</p>' +
            '<button class="btn" data-action="start-edit">Editar mi perfil</button>' +
          '</div>'
        );
      }
    } else {
      if (solicitudes.length === 0) {
        body += '<div class="empty-state"><h3>Aún no recibiste solicitudes</h3><p>Cuando un paciente te escriba, aparecerá aquí.</p></div>';
      } else {
        solicitudes.slice().reverse().forEach(function (s) {
          body += (
            '<div class="req-item">' +
              '<div class="meta">' + escapeHtml(s.pacienteNombre) + ' · ' + fmtFecha(s.fecha) + ' · <span class="status-pill ' + (s.estado === "contactado" ? "cont" : "pend") + '">' + (s.estado === "contactado" ? "Contactado" : "Pendiente") + '</span></div>' +
              '<p class="resumen">' + escapeHtml(s.resumen) + '</p>' +
              '<div class="field-hint">Prefiere que le contacten por ' + (s.contacto === "email" ? "correo" : "teléfono") + '</div>' +
              (s.estado !== "contactado" ? '<button class="btn btn-sm" style="margin-top:10px;" data-action="marcar-contactado" data-id="' + s.id + '">Marcar como contactado</button>' : '') +
            '</div>'
          );
        });
      }
    }

    return (
      '<div class="wrap">' +
        appTopbar(me.nombre, "Psicólogo/a") +
        '<div class="tabbar">' +
          '<button class="tabbtn' + (state.psiTab === "perfil" ? " active" : "") + '" data-action="psi-tab" data-tab="perfil">Mi perfil</button>' +
          '<button class="tabbtn' + (state.psiTab === "solicitudes" ? " active" : "") + '" data-action="psi-tab" data-tab="solicitudes">Solicitudes recibidas' + (solicitudes.filter(function (s) { return s.estado !== "contactado"; }).length ? ' <span class="tag" style="margin-left:4px;">' + solicitudes.filter(function (s) { return s.estado !== "contactado"; }).length + '</span>' : '') + '</button>' +
        '</div>' +
        body +
        '<div class="footer-space"></div>' +
      '</div>'
    );
  }

  function appTopbar(nombre, rolLabel) {
    return (
      '<div class="app-top">' +
        '<button class="brand" data-action="go-landing"><span class="brand-mark"><img src="logo/simbolo-512.png" alt=""></span>Encuéntrame</button>' +
        '<div class="who"><div>' +
          '<span>' + escapeHtml(nombre) + '</span><small>' + rolLabel + '</small>' +
        '</div><button class="btn btn-sm btn-ghost" data-action="logout">Salir</button></div>' +
      '</div>'
    );
  }

  // ---------- Render ----------
  function render() {
    var app = document.getElementById("app");
    if (state.view === "landing") app.innerHTML = viewLanding();
    else if (state.view === "auth") app.innerHTML = viewAuth();
    else if (state.view === "patient") app.innerHTML = viewPatientDashboard();
    else if (state.view === "psi") app.innerHTML = viewPsiDashboard();
  }

  // ---------- Event delegation ----------
  document.addEventListener("click", function (e) {
    if (e.target.classList && e.target.classList.contains("overlay")) {
      setState({ detailPsiId: null });
      return;
    }
    var tagLabel = e.target.closest(".tag-check");
    if (tagLabel) {
      window.setTimeout(function () {
        var input = tagLabel.querySelector("input");
        if (input) tagLabel.classList.toggle("on", input.checked);
      }, 0);
    }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");

    if (action === "go-landing") { setState({ view: "landing", authError: "", requestBanner: "", detailPsiId: null }); return; }
    if (action === "go-auth") { setState({ view: "auth", authRole: el.getAttribute("data-role"), authMode: "login", authError: "" }); return; }
    if (action === "set-auth-mode") { setState({ authMode: el.getAttribute("data-mode"), authError: "" }); return; }
    if (action === "logout") { logout(); return; }
    if (action === "patient-tab") { setState({ patientTab: el.getAttribute("data-tab") }); return; }
    if (action === "psi-tab") { setState({ psiTab: el.getAttribute("data-tab") }); return; }
    if (action === "filtro-esp") { setState({ filtroEspecialidad: el.getAttribute("data-esp") }); return; }
    if (action === "ver-perfil") { setState({ detailPsiId: el.getAttribute("data-id") }); return; }
    if (action === "close-modal") { setState({ detailPsiId: null }); return; }
    if (action === "start-edit") { setState({ editingProfile: true }); return; }
    if (action === "cancel-edit") { setState({ editingProfile: false }); return; }

    if (action === "marcar-contactado") {
      var id = el.getAttribute("data-id");
      var sols = safeGet(KEY_SOL, []);
      sols = sols.map(function (s) { return s.id === id ? Object.assign({}, s, { estado: "contactado" }) : s; });
      safeSet(KEY_SOL, sols);
      render();
      return;
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.matches('[data-action="filtro-texto"]')) {
      state.filtroTexto = e.target.value;
      var cursorPos = e.target.selectionStart;
      var app = document.getElementById("app");
      var scrollPos = window.scrollY;
      app.innerHTML = viewPatientDashboard();
      window.scrollTo(0, scrollPos);
      var refocused = app.querySelector('[data-action="filtro-texto"]');
      if (refocused) {
        refocused.focus();
        try { refocused.setSelectionRange(cursorPos, cursorPos); } catch (err) {}
      }
    }
    if (e.target.matches('[data-action="photo-input"]')) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        e.target.setAttribute("data-loaded", "1");
        e.target._dataUrl = reader.result;
        var row = e.target.closest(".photo-row");
        if (row) {
          var av = row.querySelector(".avatar");
          if (av) {
            av.style.backgroundImage = "url(" + JSON.stringify(reader.result) + ")";
            av.textContent = "";
          }
        }
      };
      reader.readAsDataURL(file);
    }
  });

  document.addEventListener("submit", function (e) {
    var form = e.target.closest("form[data-form]");
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute("data-form");
    var fd = new FormData(form);

    if (kind === "login") {
      var email = (fd.get("email") || "").toString().trim().toLowerCase();
      var pw = (fd.get("password") || "").toString();
      var role = state.authRole;
      var list = safeGet(role === "paciente" ? KEY_PAC : KEY_PSI, []);
      var found = list.filter(function (u) { return u.email.toLowerCase() === email; })[0];
      if (!found || found.passwordHash !== hashPassword(pw)) {
        setState({ authError: "Correo o contraseña incorrectos." });
        return;
      }
      safeSet(KEY_SESSION, { tipo: role, id: found.id });
      setState({ session: { tipo: role, id: found.id }, view: role === "paciente" ? "patient" : "psi", authError: "", requestBanner: "" });
      return;
    }

    if (kind === "register-paciente") {
      var nombre = (fd.get("nombre") || "").toString().trim();
      var email2 = (fd.get("email") || "").toString().trim().toLowerCase();
      var pw2 = (fd.get("password") || "").toString();
      if (!nombre || !email2 || !pw2) { setState({ authError: "Completa todos los campos." }); return; }
      var pacientes = safeGet(KEY_PAC, []);
      if (pacientes.some(function (p) { return p.email.toLowerCase() === email2; })) {
        setState({ authError: "Ya existe una cuenta de paciente con ese correo." });
        return;
      }
      var nuevo = { id: uid(), nombre: nombre, email: email2, passwordHash: hashPassword(pw2) };
      pacientes.push(nuevo);
      safeSet(KEY_PAC, pacientes);
      safeSet(KEY_SESSION, { tipo: "paciente", id: nuevo.id });
      setState({ session: { tipo: "paciente", id: nuevo.id }, view: "patient", authError: "" });
      return;
    }

    if (kind === "register-psicologo") {
      var nombreP = (fd.get("nombre") || "").toString().trim();
      var emailP = (fd.get("email") || "").toString().trim().toLowerCase();
      var pwP = (fd.get("password") || "").toString();
      if (!nombreP || !emailP || !pwP) { setState({ authError: "Completa nombre, correo y contraseña." }); return; }
      var psi = safeGet(KEY_PSI, []);
      if (psi.some(function (p) { return p.email.toLowerCase() === emailP; })) {
        setState({ authError: "Ya existe un perfil de psicólogo con ese correo." });
        return;
      }
      var especialidades = fd.getAll("especialidad");
      var fotoInput = form.querySelector('[data-action="photo-input"]');
      var fotoDataUrl = fotoInput && fotoInput._dataUrl ? fotoInput._dataUrl : "";
      var nuevoP = {
        id: uid(), nombre: nombreP, email: emailP, passwordHash: hashPassword(pwP),
        fotoDataUrl: fotoDataUrl,
        especialidades: especialidades,
        bio: (fd.get("bio") || "").toString().trim(),
        contactoEmail: emailP,
        contactoTelefono: (fd.get("telefono") || "").toString().trim()
      };
      psi.push(nuevoP);
      safeSet(KEY_PSI, psi);
      safeSet(KEY_SESSION, { tipo: "psicologo", id: nuevoP.id });
      setState({ session: { tipo: "psicologo", id: nuevoP.id }, view: "psi", authError: "" });
      return;
    }

    if (kind === "edit-perfil") {
      var psi2 = safeGet(KEY_PSI, []);
      var meIdx = psi2.findIndex(function (p) { return p.id === state.session.id; });
      if (meIdx === -1) return;
      var fotoInput2 = form.querySelector('[data-action="photo-input"]');
      var fotoNueva = fotoInput2 && fotoInput2._dataUrl ? fotoInput2._dataUrl : psi2[meIdx].fotoDataUrl;
      psi2[meIdx] = Object.assign({}, psi2[meIdx], {
        nombre: (fd.get("nombre") || "").toString().trim() || psi2[meIdx].nombre,
        contactoEmail: (fd.get("contactoEmail") || "").toString().trim(),
        contactoTelefono: (fd.get("contactoTelefono") || "").toString().trim(),
        especialidades: fd.getAll("especialidad"),
        bio: (fd.get("bio") || "").toString().trim(),
        fotoDataUrl: fotoNueva
      });
      safeSet(KEY_PSI, psi2);
      setState({ editingProfile: false });
      return;
    }

    if (kind === "solicitud") {
      var psiId = form.getAttribute("data-psi-id");
      var pacientes2 = safeGet(KEY_PAC, []);
      var me2 = pacientes2.filter(function (p) { return p.id === state.session.id; })[0];
      if (!me2) return;
      var resumen = (fd.get("resumen") || "").toString().trim();
      if (!resumen) return;
      var solicitudes = safeGet(KEY_SOL, []);
      solicitudes.push({
        id: uid(),
        pacienteId: me2.id,
        pacienteNombre: me2.nombre,
        psicologoId: psiId,
        resumen: resumen,
        contacto: (fd.get("contacto") || "email").toString(),
        fecha: new Date().toISOString(),
        estado: "pendiente"
      });
      safeSet(KEY_SOL, solicitudes);
      var psiRef2 = safeGet(KEY_PSI, []).filter(function (p) { return p.id === psiId; })[0];
      setState({ detailPsiId: null, patientTab: "solicitudes", requestBanner: "Tu solicitud se envió a " + (psiRef2 ? psiRef2.nombre : "el psicólogo") + ". Te contactará pronto." });
      return;
    }
  });

  // ---------- Init ----------
  seedIfEmpty();
  if (state.session) {
    var validSession = false;
    if (state.session.tipo === "paciente") {
      validSession = safeGet(KEY_PAC, []).some(function (p) { return p.id === state.session.id; });
    } else if (state.session.tipo === "psicologo") {
      validSession = safeGet(KEY_PSI, []).some(function (p) { return p.id === state.session.id; });
    }
    if (validSession) {
      state.view = state.session.tipo === "paciente" ? "patient" : "psi";
    } else {
      state.session = null;
      localStorage.removeItem(KEY_SESSION);
    }
  }
  render();
})();
</script>
</body>
</html>
